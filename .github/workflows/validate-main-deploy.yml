name: Validate main deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: Validate YAML
        run: |
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [
              Path('release/main-source-lock.yaml'),
              Path('deploy/efb-profile.example/profiles/default/config.yaml'),
              Path('deploy/efb-profile.example/profiles/default/wechat.linux/config.yaml'),
              Path('deploy/efb-profile.example/profiles/default/blueset.telegram/config.yaml.example'),
          ]:
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
      - name: Reject committed secrets and mutable latest tags
        run: |
          ! git grep -nE '([0-9]{8,10}:[A-Za-z0-9_-]{30,}|ghcr\.io/.+:latest)' -- deploy release/main-source-lock.yaml
