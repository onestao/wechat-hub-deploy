services:
  efb-multi:
    # Immutable RC.14 functional artifact. Do NOT substitute a tag or an older pin.
    image: ghcr.io/onestao/wechat-hub-efb-linux-wechat-slave@sha256:d45029d586b9224c92a1097191f0add81e793ff826e7ca2e5e91eef077456241
    container_name: wechat-hub-f-live-efb
    # Controlled restart policy: a failing process must stay stopped and be inspected.
    restart: "no"
    pids_limit: 100
    volumes:
      # Existing production EFB profile: cursor, effect ledger, message mapping,
      # telegram config and master/slave channel wiring all live here.
      - /mnt/user/appdata/wechat-hub-f-live/efb-profile:/root/.ehforwarderbot
    networks:
      - internal
