# Production overlay: consumes pinned digests from the release manifest.
# Apply on top of the base stack compose:
#   docker compose -f stack/docker-compose.yml -f release/docker-compose.production.yml up -d

services:
  wechat-runtime:
    image: ghcr.io/onestao/wechat-hub-runtime@sha256:80490cf6a29de306887ca2a9b2218825be1d28c5eafe9cfb9f7978faa1a12e4c
    build: !reset null
    pids_limit: 200
    environment:
      - WECHAT_SELKIES_ATTACH_ENABLED=true
      # P0: also disable clipboard in the Runtime Manager's own
      # linuxserver/baseimage-selkies service. The WECHAT_* flag above only
      # controls the on-demand AgentWechat companion.
      - SELKIES_CLIPBOARD_ENABLED=false|locked
      - SELKIES_CLIPBOARD_IN_ENABLED=false|locked
      - SELKIES_CLIPBOARD_OUT_ENABLED=false|locked
      - SELKIES_ENABLE_BINARY_CLIPBOARD=false|locked
      - SELKIES_UI_SIDEBAR_SHOW_CLIPBOARD=false|locked
      - WECHAT_SELKIES_PIDS_LIMIT=100
      - AGENT_WECHAT_PIDS_LIMIT=512
      - WECHAT_SELKIES_IDLE_TTL_SECONDS=10
      - WECHAT_DESKTOP_GATEWAY_PUBLIC_SCHEME=${WECHAT_DESKTOP_GATEWAY_PUBLIC_SCHEME:-http}
      - WECHAT_DESKTOP_GATEWAY_PUBLIC_HOST=${WECHAT_DESKTOP_GATEWAY_PUBLIC_HOST:-}
      - WECHAT_DESKTOP_GATEWAY_PUBLIC_PORT=${WECHAT_DESKTOP_GATEWAY_PUBLIC_PORT:-}

  wechat-core:
    image: ghcr.io/onestao/wechat-hub-core@sha256:40dea31b7b28e67e53e9f570334b488d68e3314703381dd1f59b32b22bbde453
    build: !reset null
    pids_limit: 100

  wechat-console:
    image: ghcr.io/onestao/wechat-hub-console@sha256:d27870c69cf964d06e09b840f984a3a8031b4863d29157aff50420f3123094a1
    build: !reset null
    pids_limit: 100

  wechat-agent:
    image: ghcr.io/onestao/wechat-hub-agent@sha256:d84d66182a84063598b6147ac1e64a098e0c5203b8f74aa472b86ddaa702df74
    build: !reset null
    pids_limit: 100

  efb-multi:
    image: ghcr.io/onestao/wechat-hub-efb-linux-wechat-slave@sha256:b635714873ffe2c0ad9bcfce9295545631d1e2ad301a48f7f71f0d59a5ee5e15
    build: !reset null
    pids_limit: 100

